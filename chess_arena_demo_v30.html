function playGameSound(kind='move'){

  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  audioContext=audioContext||new AudioCtx();
  if(audioContext.state==='suspended')audioContext.resume();
  const now=audioContext.currentTime;
  // A short, naturalistic wooden chess-piece tap: layered impact + soft table resonance.
  const duration=kind==='end'?.72:.16;
  const buffer=audioContext.createBuffer(1,Math.ceil(audioContext.sampleRate*duration),audioContext.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
   const t=i/audioContext.sampleRate;
   const decay=Math.exp(-t*(kind==='end'?15:34));
   const noise=(Math.random()*2-1)*decay;
   const body=Math.sin(2*Math.PI*(kind==='end'?185:225)*t)*Math.exp(-t*(kind==='end'?13:29));
   const click=Math.sin(2*Math.PI*(kind==='end'?1450:1750)*t)*Math.exp(-t*95);
   data[i]=noise*.20+body*.48+click*.20;
  }
  const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();
  source.buffer=buffer;filter.type='lowpass';filter.frequency.value=kind==='end'?1900:2600;
  gain.gain.setValueAtTime(kind==='end'?.52:.68,now);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
  source.start(now);
  if(kind==='end'){
   const second=audioContext.createBufferSource(),g2=audioContext.createGain();
   second.buffer=buffer;g2.gain.setValueAtTime(.24,now+.17);g2.gain.exponentialRampToValueAtTime(.0001,now+.17+duration);
   second.connect(filter);filter.connect(g2);g2.connect(audioContext.destination);second.start(now+.17);
  }
 }catch(e){console.warn('Game sound unavailable',e)}
}

function pieceChar(p){
 const glyphs={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
 const names={k:'shoh',q:'farzin',r:'rux',b:'fil',n:'ot',p:'piyoda'};
 const color=p.color==='w'?'white-piece':'black-piece';
 return `<span class="piece3d ${color}" role="img" aria-label="${p.color==='w'?'Oq':'Qora'} ${names[p.type]}">${glyphs[p.color+p.type]}</span>`;
}
function tapSquare(sq){if(!chess||chess.game_over()||reviewMode)return;if((gameMode==='online'||gameMode==='computer')&&chess.turn()!==myColor)return;const piece=chess.get(sq);if(selectedSquare){const candidate=legalTargets.find(m=>m.to===sq);if(candidate){if(candidate.promotion){showPromotionChoice(selectedSquare,sq,chess.turn());return}finishPlayerMove(selectedSquare,sq);return}if(piece&&piece.color===chess.turn()){selectedSquare=sq;legalTargets=chess.moves({square:sq,verbose:true})}else{selectedSquare=null;legalTargets=[]}}else if(piece&&piece.color===chess.turn()){selectedSquare=sq;legalTargets=chess.moves({square:sq,verbose:true})}renderGame()}
function showPromotionChoice(from,to,color){
 const glyphs={q:'♕',r:'♖',b:'♗',n:'♘'};
 const labels={q:lang==='uz'?'Farzin':lang==='ru'?'Ферзь':'Queen',r:lang==='uz'?'Rux':lang==='ru'?'Ладья':'Rook',b:lang==='uz'?'Fil':lang==='ru'?'Слон':'Bishop',n:lang==='uz'?'Ot':lang==='ru'?'Конь':'Knight'};
 const overlay=document.createElement('div');overlay.id='promotionChoice';overlay.className='game-result';
 overlay.innerHTML=`<div class="game-result-card"><h2 class="game-result-title">${lang==='uz'?'Piyoda qaysi donaga aylansin?':lang==='ru'?'Выберите фигуру для пешки':'Choose a piece for promotion'}</h2><div class="promotion-options">${['q','r','b','n'].map(t=>`<button class="promotion-option" onclick="finishPlayerMove('${from}','${to}','${t}')"><span class="promotion-glyph ${color==='w'?'white-piece':'black-piece'}">${color==='w'?glyphs[t]:glyphs[t].replace('♕','♛').replace('♖','♜').replace('♗','♝').replace('♘','♞')}</span><span>${labels[t]}</span></button>`).join('')}</div><button onclick="cancelPromotionChoice()">${lang==='uz'?'Bekor qilish':lang==='ru'?'Отмена':'Cancel'}</button></div>`;
 document.body.appendChild(overlay);
}
function cancelPromotionChoice(){document.getElementById('promotionChoice')?.remove();selectedSquare=null;legalTargets=[];renderGame()}
function finishPlayerMove(from,to,promotion='q'){
 if(reviewMode)return;
 document.getElementById('promotionChoice')?.remove();const move=chess.move({from,to,promotion});if(!move)return;
 playGameSound('move');saveReviewSnapshot();if(gameMode==='online'&&conn&&conn.open)conn.send({type:'move',from,to,promotion});
 selectedSquare=null;legalTargets=[];renderGame();if(gameMode==='computer'&&chess&&!chess.game_over())setTimeout(computerMove,450);
}
function evaluatePosition(position, botColor){
 const values={p:100,n:320,b:335,r:500,q:900,k:20000};
 let score=0,bishops={w:0,b:0};
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const p=position.b[r][c];if(!p)continue;
  const sign=p.color===botColor?1:-1,advance=p.color==='w'?6-r:r-1;
  let bonus=0;
  if(p.type==='p')bonus=advance*7+(c>=2&&c<=5?8:0);
  else if(p.type==='n')bonus=(3.5-Math.abs(3.5-r))*5+(3.5-Math.abs(3.5-c))*5;
  else if(p.type==='b'){bonus=8;bishops[p.color]++}
  else if(p.type==='q')bonus=(3.5-Math.abs(3.5-r))+(3.5-Math.abs(3.5-c));
  else if(p.type==='k'&&position.full<20)bonus=-Math.abs(3.5-c)*5;
  score+=sign*(values[p.type]+bonus);
 }
 if(bishops.w>=2)score+=botColor==='w'?35:-35;
 if(bishops.b>=2)score+=botColor==='b'?35:-35;
 if(position.check(position.side))score+=position.side===botColor?-22:22;
 return score;
}
function orderedMoves(position){
 return position.moves({verbose:true}).sort((a,b)=>{
  const value=m=>{const target=position.get(m.to);return (m.promotion?850:0)+(target?({p:100,n:320,b:335,r:500,q:900}[target.type]||0):0)};
  return value(b)-value(a);
 });
}
function searchChess(position,depth,alpha,beta,botColor,ply=0){
 if(position.is_checkmate())return position.side===botColor?-100000+ply:100000-ply;
 if(position.in_draw())return 0;
 if(depth<=0)return evaluatePosition(position,botColor);
 const moves=orderedMoves(position),maximizing=position.side===botColor;
 let best=maximizing?-Infinity:Infinity;
 for(const m of moves){
  const child=position.clone();child.move({from:m.from,to:m.to,promotion:m.promotion||'q'});
  const value=searchChess(child,depth-1,alpha,beta,botColor,ply+1);
  if(maximizing){best=Math.max(best,value);alpha=Math.max(alpha,best)}
  else{best=Math.min(best,value);beta=Math.min(beta,best)}
  if(beta<=alpha)break;
 }
 return best;
}
function chooseComputerMove(position,botColor){
 const moves=orderedMoves(position);if(!moves.length)return null;
 let best=-Infinity,choices=[];
 for(const m of moves){
  const child=position.clone();child.move({from:m.from,to:m.to,promotion:m.promotion||'q'});
  const score=searchChess(child,2,-Infinity,Infinity,botColor,1);
  if(score>best){best=score;choices=[m]}else if(score===best)choices.push(m);
 }
 return choices[Math.floor(Math.random()*choices.length)];
}
function computerMove(){if(!chess||chess.game_over()||gameMode!=='computer'||chess.turn()===myColor)return;const move=chooseComputerMove(chess,myColor);if(!move)return;chess.move({from:move.from,to:move.to,promotion:move.promotion||'q'});saveReviewSnapshot();playGameSound('move');renderGame()}
function restartGame(){if(gameMode==='online'){alert(lang==='uz'?'Onlayn o‘yinni qayta boshlash uchun yangi xona oching.':'Create a new room to restart online game.');return}startGame(gameMode==='computer'?'computer':'local')}
try{selectedTheme=Number(localStorage.getItem("chessArenaTheme")||0)}catch(e){selectedTheme=0}
if(!Number.isInteger(selectedTheme)||selectedTheme<0||selectedTheme>=themes.length)selectedTheme=0;applyBoardTheme();
</script></body></html>
